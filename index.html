<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Стэк">
<meta name="theme-color" content="#0d0f1a">
<title>Ноотропный Стэк</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0d0f1a;--s1:#131629;--s2:#1a1f38;--bd:#252a45;--acc:#4f7cff;--acc2:#7c4fff;--grn:#2ecc8a;--org:#ff7c4f;--red:#ff4f6b;--pur:#9b59ff;--tel:#4fd4c8;--yel:#ffc44f;--tx:#e8eaf6;--tx2:#8892b0;--tx3:#4a5280;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,var(--s1),var(--s2));padding:14px 16px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.hdr h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:5px}
.hdr-sub{font-size:11px;color:var(--tx2)}
.badge{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:5px 11px;text-align:right}
.badge-date{font-size:14px;font-weight:700;color:var(--acc)}
.badge-sub{font-size:10px;color:var(--tx2);margin-top:1px}
.prog{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 12px 0}
.prog-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.prog-bar{height:5px;background:var(--bd);border-radius:100px;overflow:hidden}
.prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1s}
.prog-dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pd{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2)}
.pd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tabs{display:flex;gap:6px;padding:8px 12px 0;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:100px;border:1px solid var(--bd);background:var(--s1);color:var(--tx2);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;-webkit-appearance:none;font-family:inherit}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.content{flex:1;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.tblock{margin-bottom:16px}
.tlabel{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:7px}
.ditem{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--s1);border-radius:8px;margin-bottom:5px}
.ddot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dname{flex:1;font-size:13px;font-weight:500}
.ddose{font-size:11px;color:var(--tx2)}
.section-sep{margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)}
.sec-mini-label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.urow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.restock-box{margin-top:14px;padding:11px 13px;background:rgba(255,196,79,.08);border:1px solid rgba(255,196,79,.2);border-radius:10px}
.restock-title{font-size:12px;font-weight:700;color:var(--yel);margin-bottom:6px}
.restock-row{font-size:11px;color:var(--tx2);margin-bottom:3px}
.empty{text-align:center;color:var(--tx2);padding:40px 0;font-size:14px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:13px;margin-bottom:9px;position:relative;overflow:hidden}
.card-top{position:absolute;top:0;left:0;right:0;height:3px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.card-name{font-size:13px;font-weight:600;flex:1;padding-right:8px;line-height:1.3}
.sbadge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.card-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.dl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.dv{font-size:12px;font-weight:600;margin-top:1px}
.mini-bar{height:3px;background:var(--bd);border-radius:100px;overflow:hidden;margin-bottom:7px}
.mini-fill{height:100%;border-radius:100px;transition:width 1s}
.card-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2)}
.warn-txt{font-size:10px;color:var(--red);margin-top:5px}
.group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:14px 0 9px}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.cal-month{font-size:16px;font-weight:700}
.cal-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:13px;overflow:hidden}
.cal-wd-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--s2);border-bottom:1px solid var(--bd)}
.cal-wd{padding:7px 2px;text-align:center;font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{min-height:58px;padding:5px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer;transition:background 0.15s;position:relative}
.cal-day:nth-child(7n){border-right:none}
.cal-day:hover{background:var(--s2)}
.cal-day.today{background:rgba(79,124,255,.08)}
.cal-day.other{opacity:.25;pointer-events:none}
.cal-day.has-event{cursor:pointer}
.cal-num{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;color:var(--tx2);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.cal-num.today-num{background:var(--acc);color:#fff}
.cal-ev{font-size:8px;padding:1px 3px;border-radius:2px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;animation:slideUp .25s ease}
.modal-date{font-size:12px;color:var(--tx2);margin-bottom:4px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--acc)}
.modal-close{float:right;background:var(--bd);border:none;color:var(--tx);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;margin-top:-4px}
.modal-section{margin-bottom:14px}
.modal-sec-label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.modal-drug{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--s2);border-radius:8px;margin-bottom:5px}
.modal-drug-name{flex:1;font-size:13px;font-weight:500}
.modal-drug-dose{font-size:11px;color:var(--tx2)}
.pause-notice{padding:10px 12px;background:rgba(255,79,107,.08);border:1px solid rgba(255,79,107,.2);border-radius:8px;font-size:12px;color:var(--red);font-weight:600}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
/* TIMELINE */
.tl-item{display:flex;gap:11px;margin-bottom:3px}
.tl-date{font-size:10px;color:var(--tx3);min-width:58px;text-align:right;padding-top:3px;flex-shrink:0}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.tl-body{flex:1;padding-bottom:9px;border-bottom:1px solid var(--bd)}
.tl-lbl{font-size:12px;font-weight:600}
.tl-desc{font-size:11px;color:var(--tx2);margin-top:2px}
</style>
</head>
<body>

<div class="hdr">
  <h1>НООТРОПНЫЙ СТЭК</h1>
  <div class="hdr-row">
    <div class="hdr-sub">Старт 4 июня 2026 • Конец 6 октября 2026</div>
    <div class="badge">
      <div class="badge-date" id="todayDate"></div>
      <div class="badge-sub" id="dayInfo"></div>
    </div>
  </div>
</div>

<div class="prog">
  <div class="prog-row">
    <span style="color:var(--tx2);font-size:11px">Прогресс курса</span>
    <span style="font-weight:700;font-size:12px" id="pctLabel">0%</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-dots">
    <div class="pd"><div class="pd-dot" style="background:#4fd4c8"></div>Фундамент</div>
    <div class="pd"><div class="pd-dot" style="background:#4f7cff"></div>CDP+Ноопепт (нед.3)</div>
    <div class="pd"><div class="pd-dot" style="background:#ff7c4f"></div>Lion's Mane (нед.4)</div>
    <div class="pd"><div class="pd-dot" style="background:#2ecc8a"></div>Родиола (нед.5)</div>
    <div class="pd"><div class="pd-dot" style="background:#9b59ff"></div>Бакопа (нед.6)</div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="showTab('today',this)">Сегодня</button>
  <button class="tab" onclick="showTab('drugs',this)">Препараты</button>
  <button class="tab" onclick="showTab('calendar',this)">Календарь</button>
  <button class="tab" onclick="showTab('timeline',this)">Хронология</button>
</div>

<div class="content">
  <div id="tab-today"></div>
  <div id="tab-drugs" style="display:none"></div>
  <div id="tab-calendar" style="display:none"></div>
  <div id="tab-timeline" style="display:none"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="document.getElementById('modal').style.display='none'">✕</button>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const START = new Date(2026,5,4);
const END   = new Date(2026,8,6); // Oct 6

function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diff(a,b){return Math.round((b-a)/86400000);}
const MO=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const MOFU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function fs(d){return d.getDate()+' '+MO[d.getMonth()];}
function ff(d){return d.getDate()+' '+MO[d.getMonth()]+' ('+WD[d.getDay()]+')';}

// Mini-break dates: Noopept+CDP+Ginkgo pause Aug 18–31
const MINI_BREAK_S = new Date(2026,7,18);
const MINI_BREAK_E = new Date(2026,7,31);
// Rhodiola break Aug 13–26
const ROD_BREAK_S  = new Date(2026,7,13);
const ROD_BREAK_E  = new Date(2026,7,26);

const DRUGS=[
  {n:"Омега-3 Lemcaps",       g:"fund",c:"#4fd4c8",s:addD(START,0),  e:END,            dose:"1 капс.",  t:"утро",       cy:"Постоянно", perm:1},
  {n:"Магний Бисглицинат+B6", g:"fund",c:"#4fd4c8",s:addD(START,0),  e:END,            dose:"2 капс.",  t:"вечер",      cy:"Постоянно", perm:1},
  {n:"Витамин D3 Вигантол",   g:"fund",c:"#4fd4c8",s:addD(START,0),  e:END,            dose:"4 капли",  t:"утро",       cy:"Постоянно", perm:1},
  {n:"B-комплекс VitaMeal",   g:"fund",c:"#4fd4c8",s:addD(START,0),  e:END,            dose:"1 капс.",  t:"утро",       cy:"125 дней"},
  {n:"L-теанин VitaMeal",     g:"fund",c:"#4fd4c8",s:addD(START,0),  e:END,            dose:"1 капс.",  t:"утро",       cy:"Постоянно", perm:1},
  {n:"Ноопепт 10 мг",         g:"noot",c:"#4f7cff",s:addD(START,14), e:END,            dose:"10мг×2",   t:"утро+обед",  cy:"С паузой авг.", w:"До 14:00! Пауза 18–31 авг.", mb:1},
  {n:"CDP-холин Double Wood",  g:"noot",c:"#4f7cff",s:addD(START,14), e:END,            dose:"300мг×2",  t:"утро+обед",  cy:"С паузой авг.", mb:1},
  {n:"Lion's Mane IPSUM",      g:"noot",c:"#4f7cff",s:addD(START,21), e:END,            dose:"2 капс.",  t:"вечер",      cy:"Непрерывно"},
  {n:"Гинкго Biloba DB",       g:"noot",c:"#4f7cff",s:addD(START,14), e:END,            dose:"1 капс.",  t:"утро",       cy:"С паузой авг.", mb:1},
  {n:"Родиола GLS",            g:"anti",c:"#ff7c4f",s:addD(START,28), e:END,            dose:"1 капс.",  t:"утро",       cy:"Цикл 6/2 нед.", rb:1, w:"Перерыв 13–26 авг."},
  {n:"Бакопа Himalaya",        g:"anti",c:"#9b59ff",s:addD(START,35), e:END,            dose:"1 табл.",  t:"вечер",      cy:"Непрерывно 90д"},
];

const SL={active:"Активен",upcoming:"Скоро",brk:"Перерыв",perm:"Постоянно",done:"Завершён"};
const SC={active:"#2ecc8a",upcoming:"#4f7cff",brk:"#ff4f6b",perm:"#4fd4c8",done:"#4a5280"};

const today=new Date();today.setHours(0,0,0,0);
const cDay=diff(START,today)+1;
const inCourse=today>=START&&today<=END;
const pct=today<START?0:today>END?100:Math.min(100,Math.round((diff(START,today)/diff(START,END))*100));

document.getElementById('todayDate').textContent=ff(today);
document.getElementById('dayInfo').textContent=inCourse?`День курса: ${cDay}`
  :today<START?`До старта: ${diff(today,START)} дн.`:'Курс завершён';
document.getElementById('pctLabel').textContent=pct+'%';
document.getElementById('progFill').style.width=pct+'%';

function isInMiniBreak(drug, dt) {
  return drug.mb && dt >= MINI_BREAK_S && dt <= MINI_BREAK_E;
}
function isInRodBreak(drug, dt) {
  return drug.rb && dt >= ROD_BREAK_S && dt <= ROD_BREAK_E;
}

function getStatus(drug, dt) {
  if (isInMiniBreak(drug, dt) || isInRodBreak(drug, dt)) return "brk";
  if (dt < drug.s) return "upcoming";
  if (dt > drug.e) return "done";
  if (drug.perm) return "perm";
  return "active";
}

// Get active drugs for a given date
function getDrugsForDate(dt) {
  const d = new Date(dt); d.setHours(0,0,0,0);
  const mor=[], lun=[], eve=[], brk=[], up=[];
  DRUGS.forEach(drug => {
    const ds = new Date(drug.s); ds.setHours(0,0,0,0);
    const de = new Date(drug.e); de.setHours(0,0,0,0);
    if (d < ds) { up.push(drug); return; }
    if (d > de) return;
    if (isInMiniBreak(drug, d) || isInRodBreak(drug, d)) { brk.push(drug); return; }
    if (drug.t.includes('утро')) mor.push(drug);
    if (drug.t.includes('обед')) lun.push(drug);
    if (drug.t.includes('вечер')) eve.push(drug);
  });
  return {mor, lun, eve, brk};
}

// TODAY TAB
function renderToday() {
  const {mor, lun, eve} = getDrugsForDate(today);
  let h='';
  if (!mor.length && !lun.length && !eve.length) {
    h=`<div class="empty">${today<START?'Курс начнётся<br>'+ff(START):'Нет активных препаратов'}</div>`;
  } else {
    [['☀️ УТРОМ — с едой',mor],['🕐 ОБЕД — до 14:00!',lun],['🌙 ВЕЧЕРОМ — с едой',eve]].forEach(([lbl,items])=>{
      if(!items.length)return;
      h+=`<div class="tblock"><div class="tlabel">${lbl}</div>`;
      items.forEach(d=>{h+=`<div class="ditem"><div class="ddot" style="background:${d.c}"></div><div class="dname">${d.n}</div><div class="ddose">${d.dose}</div></div>`;});
      h+='</div>';
    });
  }
  const up=DRUGS.filter(d=>{const dd=diff(today,d.s);return dd>0&&dd<=14;});
  if(up.length){
    h+=`<div class="section-sep"><div class="sec-mini-label">Скоро добавить</div>`;
    up.forEach(d=>{h+=`<div class="urow"><div class="ddot" style="background:${d.c}"></div><span style="flex:1">${d.n}</span><span style="color:var(--yel);font-weight:700">через ${diff(today,d.s)} дн.</span></div>`;});
    h+='</div>';
  }
  // Break alerts
  const alerts=[];
  const dd=new Date(today);dd.setHours(0,0,0,0);
  if(dd>=MINI_BREAK_S&&dd<=MINI_BREAK_E) alerts.push('⚠️ ПАУЗА: Ноопепт + CDP-холин + Гинкго — сегодня не принимать!');
  if(dd>=ROD_BREAK_S&&dd<=ROD_BREAK_E)  alerts.push('⚠️ ПЕРЕРЫВ: Родиола — сегодня не принимать!');
  if(alerts.length){
    h+=`<div style="margin-top:14px;padding:11px 13px;background:rgba(255,79,107,.08);border:1px solid rgba(255,79,107,.3);border-radius:10px">`;
    alerts.forEach(a=>{h+=`<div style="font-size:12px;color:var(--red);font-weight:600;margin-bottom:4px">${a}</div>`;});
    h+='</div>';
  }
  document.getElementById('tab-today').innerHTML=h;
}

// DRUGS TAB
function renderDrugs() {
  const groups=[['fund','#4fd4c8','ФУНДАМЕНТ'],['noot','#4f7cff','НООТРОПНЫЙ БЛОК'],['anti','#ff7c4f','АНТИСТРЕСС']];
  let h='';
  groups.forEach(([g,c,lbl])=>{
    h+=`<div class="group-label" style="color:${c}">${lbl}</div>`;
    DRUGS.filter(d=>d.g===g).forEach(drug=>{
      const st=getStatus(drug,today);
      const total=diff(drug.s,drug.e);
      const elapsed=Math.max(0,Math.min(total,diff(drug.s,today)));
      const p=st==='upcoming'?0:Math.round((elapsed/total)*100);
      const dLeft=(st==='active'||st==='perm')?diff(today,drug.e):st==='upcoming'?diff(today,drug.s):null;
      const dLeftTxt=dLeft!==null?(st==='upcoming'?`через ${dLeft} дн.`:`${dLeft} дн. осталось`):(st==='done'?'завершён':'');
      const dLeftColor=dLeft!==null&&dLeft<=7?'var(--yel)':st==='upcoming'?'var(--acc)':'var(--tx2)';
      h+=`<div class="card">
        <div class="card-top" style="background:${SC[st]}"></div>
        <div class="card-head">
          <div class="card-name">${drug.n}</div>
          <span class="sbadge" style="background:${SC[st]}22;color:${SC[st]}">${SL[st]}</span>
        </div>
        <div class="card-dates">
          <div><div class="dl">Начало</div><div class="dv">${fs(drug.s)}</div></div>
          <div><div class="dl">Конец</div><div class="dv">${fs(drug.e)}</div></div>
        </div>
        <div class="mini-bar"><div class="mini-fill" style="width:${p}%;background:${drug.c}"></div></div>
        <div class="card-foot">
          <span>${drug.dose} • ${drug.t}</span>
          <span style="font-weight:700;color:${dLeftColor}">${dLeftTxt}</span>
        </div>
        ${drug.w?`<div class="warn-txt">⚠ ${drug.w}</div>`:''}
      </div>`;
    });
  });
  document.getElementById('tab-drugs').innerHTML=h;
}

// CALENDAR TAB
let calYear=2026, calMonth=5;

function renderCal() {
  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  let dow=first.getDay();if(dow===0)dow=7;
  let h=`<div class="cal-nav">
    <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
    <span class="cal-month">${MOFU[calMonth]} ${calYear}</span>
    <button class="cal-nav-btn" onclick="nextMonth()">›</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-wd-row">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="cal-wd">${d}</div>`).join('')}</div>
    <div class="cal-grid">`;

  let cur=new Date(first);cur.setDate(cur.getDate()-(dow-1));
  for(let w=0;w<6;w++){
    for(let d=0;d<7;d++){
      const isT=cur.toDateString()===today.toDateString();
      const isO=cur.getMonth()!==calMonth;
      const dd=new Date(cur);dd.setHours(0,0,0,0);
      const {mor,lun,eve,brk}=getDrugsForDate(dd);
      const allActive=[...mor,...lun,...eve];
      const inCourseDay = dd>=new Date(2026,5,4) && dd<=END;
      const dateStr=`${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;

      h+=`<div class="cal-day${isT?' today':''}${isO?' other':''}" onclick="${isO?'':'openDay('+cur.getFullYear()+','+cur.getMonth()+','+cur.getDate()+')'}">
        <div class="cal-num${isT?' today-num':''}">${cur.getDate()}</div>`;

      if(brk.length){
        h+=`<div class="cal-ev" style="background:rgba(255,79,107,.15);color:#ff4f6b">⏸ Пауза</div>`;
      }
      const shown=[...new Map(allActive.map(e=>[e.c,e])).values()].slice(0,3);
      shown.forEach(e=>{
        h+=`<div class="cal-ev" style="background:${e.c}22;color:${e.c}">${e.n.split(' ')[0]}</div>`;
      });
      if(allActive.length>3){
        h+=`<div style="font-size:8px;color:var(--tx3)">+${allActive.length-3}</div>`;
      }
      h+='</div>';
      cur.setDate(cur.getDate()+1);
    }
    if(cur>last&&w>=3)break;
  }
  h+='</div></div>';
  document.getElementById('tab-calendar').innerHTML=h;
}

function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();}

// OPEN DAY MODAL
function openDay(year, month, day) {
  const dt = new Date(year, month, day); dt.setHours(0,0,0,0);
  const {mor, lun, eve, brk} = getDrugsForDate(dt);
  const allActive = [...mor, ...lun, ...eve];

  document.getElementById('modalDate').textContent = ff(dt);

  const dNum = diff(new Date(2026,5,4), dt) + 1;
  const inC = dt >= new Date(2026,5,4) && dt <= END;
  document.getElementById('modalTitle').textContent = inC ? `День курса ${dNum}` : dt < new Date(2026,5,4) ? 'До старта' : 'После курса';

  let body = '';

  if (brk.length) {
    body += `<div class="pause-notice" style="margin-bottom:14px">`;
    brk.forEach(d => {
      const isPause = d.mb && dt >= MINI_BREAK_S && dt <= MINI_BREAK_E;
      const isRod = d.rb && dt >= ROD_BREAK_S && dt <= ROD_BREAK_E;
      if (isPause) body += `⏸ ${d.n} — ПАУЗА (18–31 авг.)<br>`;
      if (isRod)   body += `⏸ ${d.n} — ПЕРЕРЫВ (13–26 авг.)<br>`;
    });
    body += '</div>';
  }

  if (!allActive.length && !brk.length) {
    body += `<div style="color:var(--tx2);font-size:13px;text-align:center;padding:20px 0">${dt < new Date(2026,5,4) ? 'Курс ещё не начался' : 'Нет активных препаратов'}</div>`;
  } else {
    [['☀️ УТРОМ — с едой', mor], ['🕐 ОБЕД — до 14:00', lun], ['🌙 ВЕЧЕРОМ — с едой', eve]].forEach(([lbl, items]) => {
      if (!items.length) return;
      body += `<div class="modal-section">
        <div class="modal-sec-label">${lbl}</div>`;
      items.forEach(d => {
        body += `<div class="modal-drug">
          <div class="ddot" style="background:${d.c}"></div>
          <div class="modal-drug-name">${d.n}</div>
          <div class="modal-drug-dose">${d.dose}</div>
        </div>`;
      });
      body += '</div>';
    });
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
}

// TIMELINE TAB

  const events=[
    {dt:new Date(2026,5,4),   l:"СТАРТ курса",              d:"Фундамент: Омега-3, D3, B, Теанин, Магний",    c:"#4fd4c8"},
    {dt:new Date(2026,5,18),  l:"Неделя 3",                 d:"+ CDP-холин + Гинкго + Ноопепт (утро+обед)",   c:"#4f7cff"},
    {dt:new Date(2026,5,25),  l:"Неделя 4",                 d:"+ Lion's Mane (вечером)",                       c:"#ff7c4f"},
    {dt:new Date(2026,6,2),   l:"Неделя 5",                 d:"+ Родиола розовая (утром)",                     c:"#2ecc8a"},
    {dt:new Date(2026,6,9),   l:"Неделя 6 — ПОЛНЫЙ СТЭК",  d:"+ Бакопа Himalaya (вечером)",                   c:"#9b59ff"},
    {dt:new Date(2026,7,13),  l:"Родиола — ПЕРЕРЫВ",        d:"Не принимать 14 дней (до 26 августа)",          c:"#ff4f6b"},
    {dt:new Date(2026,7,18),  l:"Ноопепт+CDP+Гинкго — ПАУЗА","Мини-перерыв 14 дней (до 31 августа)",          c:"#ff4f6b"},
    {dt:new Date(2026,7,27),  l:"Родиола — возобновить",    d:"Продолжить приём до 6 октября",                 c:"#2ecc8a"},
    {dt:new Date(2026,8,1),   l:"Ноопепт+CDP+Гинкго — старт",d:"Возобновить после мини-перерыва",             c:"#4f7cff"},
    {dt:new Date(2026,9,6),   l:"КОНЕЦ КУРСА",              d:"Перерыв 1 месяц для всех курсовых препаратов",  c:"#ff4f6b"},
    {dt:new Date(2026,10,7),  l:"СТАРТ ЦИКЛА 2",            d:"Новый усиленный курс",                          c:"#4f7cff"},
  ];
  let h='';
  events.forEach(ev=>{
    const past=today>ev.dt;
    const isCur=today.toDateString()===ev.dt.toDateString();
    h+=`<div class="tl-item" style="opacity:${past?.5:1}">
      <div class="tl-date">${fs(ev.dt)}</div>
      <div class="tl-dot" style="background:${ev.c}"></div>
      <div class="tl-body">
        <div class="tl-lbl">${ev.l}${isCur?' ← сегодня':''}</div>
        <div class="tl-desc">${ev.d}</div>
      </div>
    </div>`;
  });
  document.getElementById('tab-timeline').innerHTML=h;
}

function showTab(name,btn){
  ['today','drugs','calendar','timeline'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'':'none';
  });
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  if(name==='calendar')renderCal();
  if(name==='drugs')renderDrugs();
  if(name==='timeline')renderTimeline();
  if(name==='today')renderToday();
}

renderToday();
